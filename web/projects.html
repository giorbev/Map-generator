<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-size:15px}
body{background:var(--bg-0);min-height:100vh;font-family:var(--font-body);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
.topo-bg{position:fixed;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 28px,var(--border) 29px),repeating-linear-gradient(90deg,transparent,transparent 28px,var(--border) 29px);opacity:0.1;pointer-events:none}
.vignette{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 40%,var(--bg-0) 100%);pointer-events:none}
.scan-line{position:fixed;left:0;right:0;height:1px;background:var(--border-hi);opacity:0.15;animation:scan 6s linear infinite;pointer-events:none}
@keyframes scan{0%{top:0}100%{top:100%}}
.corner{position:fixed;width:16px;height:16px;border-color:var(--border-hi);border-style:solid;z-index:10}
.tl{top:10px;left:10px;border-width:2px 0 0 2px}.tr{top:10px;right:10px;border-width:2px 2px 0 0}
.bl{bottom:10px;left:10px;border-width:0 0 2px 2px}.br{bottom:10px;right:10px;border-width:0 2px 2px 0}

/* Header */
.header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 32px 14px;border-bottom:1px solid var(--border)}
.back-btn{background:transparent;border:1px solid var(--border-hi);border-radius:6px;color:var(--accent);font-family:var(--font-title);font-size:12px;letter-spacing:1px;padding:5px 12px;cursor:pointer;transition:all .2s;text-transform:uppercase}
.back-btn:hover{background:var(--surface-hi);color:var(--text)}
.page-title{font-size:15px;color:var(--text);letter-spacing:1px;font-weight:700;text-transform:uppercase;margin-left:16px;font-family:var(--font-title)}
.header-meta{font-size:12px;color:var(--text-3);letter-spacing:1px;text-align:right;line-height:1.8}

/* Main layout */
.main{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:1fr 1.6fr;gap:0;overflow:hidden}

/* Nouveau projet */
.new-project{padding:28px 28px 28px 32px;border-right:1px solid var(--border);overflow-y:auto}
.section-title{font-size:12px;color:var(--text-2);letter-spacing:1px;text-transform:uppercase;margin-bottom:20px;padding-bottom:8px;border-bottom:1px solid var(--border);font-family:var(--font-title)}

.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--text-3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;font-family:var(--font-title)}
.field input,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--font-mono);font-size:13px;padding:9px 12px;transition:border-color .2s;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field input::placeholder,.field textarea::placeholder{color:var(--text-3)}
.field textarea{height:70px;resize:vertical}

.btn-create{width:100%;background:var(--surface-hi);border:1px solid var(--accent);border-radius:4px;color:var(--accent);font-family:var(--font-title);font-size:13px;letter-spacing:1px;padding:12px;cursor:pointer;transition:all .2s;text-transform:uppercase;margin-top:4px}
.btn-create:hover{background:var(--border-hi);color:var(--text)}

.status{font-size:12px;letter-spacing:1px;padding:8px 12px;border-radius:4px;margin-top:10px}
.status.ok{background:rgba(95,191,127,0.12);border:1px solid rgba(95,191,127,0.45);color:var(--ok)}
.status.err{background:var(--err-bg);border:1px solid var(--err-border);color:var(--err)}
.hidden{display:none}

/* Projets récents */
.projects-list{padding:28px 32px 28px 28px;overflow-y:auto}
.search-bar{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--font-title);font-size:13px;padding:9px 12px;margin-bottom:16px;outline:none;transition:border-color .2s}
.search-bar:focus{border-color:var(--accent)}
.search-bar::placeholder{color:var(--text-3)}

.project-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .2s;position:relative}
.project-card:hover{border-color:var(--border-hi);background:var(--surface-hi);transform:translateX(3px)}
.project-card.active-proj{border-color:var(--accent)}
.proj-name{font-size:14px;color:var(--text);font-weight:700;letter-spacing:1px;margin-bottom:4px}
.proj-meta{font-size:12px;color:var(--text-3);letter-spacing:1px;line-height:1.7}
.proj-hm{font-size:12px;color:var(--border-hi);margin-top:2px}
.proj-date{font-size:12px;color:var(--text-3);margin-top:2px}
.proj-actions{display:flex;gap:8px;margin-top:10px}
.btn-open{background:var(--surface-hi);border:1px solid var(--accent);border-radius:4px;color:var(--accent);font-family:var(--font-title);font-size:12px;letter-spacing:1px;padding:6px 14px;cursor:pointer;transition:all .2s;text-transform:uppercase}
.btn-open:hover{background:var(--border-hi)}
.btn-del{background:transparent;border:1px solid var(--err-bg);border-radius:4px;color:var(--err-border);font-family:var(--font-title);font-size:12px;letter-spacing:1px;padding:6px 10px;cursor:pointer;transition:all .2s}
.btn-del:hover{background:var(--err-bg);color:var(--err)}
.confirm-del{background:var(--err-bg);border:1px solid var(--err-border);border-radius:4px;padding:8px 12px;margin-top:8px;font-size:12px;color:var(--err)}
.confirm-btns{display:flex;gap:8px;margin-top:8px}
.btn-confirm-yes{background:var(--err-bg);border:1px solid var(--err-border);border-radius:3px;color:var(--err);font-family:var(--font-title);font-size:12px;padding:4px 12px;cursor:pointer}
.btn-confirm-no{background:var(--surface);border:1px solid var(--border);border-radius:3px;color:var(--text-3);font-family:var(--font-title);font-size:12px;padding:4px 12px;cursor:pointer}
.btn-export{background:transparent;border:1px solid var(--border-hi);border-radius:4px;color:var(--text-2);font-family:var(--font-title);font-size:12px;letter-spacing:1px;padding:6px 10px;cursor:pointer;transition:all .2s}
.btn-export:hover{background:var(--surface-hi);color:var(--text)}
.opt-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);margin-bottom:12px;cursor:pointer}
.opt-line input{accent-color:var(--accent)}
.status.warn{background:var(--accent-dim);border:1px solid var(--warn);color:var(--warn)}
.io-lines{margin-top:6px;line-height:1.7;letter-spacing:0;word-break:break-all}
.io-conflict input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--font-mono);font-size:13px;padding:7px 10px;margin-top:8px;outline:none}
.io-conflict input:focus{border-color:var(--accent)}
.data-path{font-family:var(--font-mono);font-size:12px;color:var(--text-2);word-break:break-all;margin-bottom:10px}
.no-projects{font-size:13px;color:var(--text-3);letter-spacing:1px;text-align:center;padding:40px 0}
.spinner{display:inline-block;width:10px;height:10px;border:2px solid var(--border-hi);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Footer */
.footer{position:relative;z-index:2;padding:10px 32px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.footer-left,.footer-right{font-size:12px;color:var(--text-3);letter-spacing:1px}
</style></head><body class="mgp-backdrop">

<!-- Header -->
<div class="header">
  <div style="display:flex;align-items:center">
    <button class="back-btn" onclick="goBack()" data-i18n="nav.home">◀ Accueil</button>
    <div class="page-title" data-i18n="proj.title">Projets</div>
  </div>
  <div class="header-meta">MAP GENERATOR PRO · V8.2.0</div>
</div>

<!-- Main -->
<div class="main">

  <!-- Nouveau projet -->
  <div class="new-project">
    <div class="section-title" data-i18n="proj.new">Nouveau projet</div>
    <div class="field">
      <label data-i18n="proj.name">Nom du projet</label>
      <input type="text" id="inp-name" placeholder="Ma_carte" autocomplete="off">
    </div>
    <div class="field">
      <label data-i18n="proj.author">Auteur</label>
      <input type="text" id="inp-author" placeholder="[otea] Giorbev" autocomplete="off">
    </div>
    <div class="field">
      <label data-i18n="proj.desc">Description</label>
      <textarea id="inp-desc" data-i18n-ph="proj.desc.ph" placeholder="Description optionnelle..."></textarea>
    </div>
    <button class="btn-create" onclick="createProject()" data-i18n="proj.create">▶ &nbsp; Créer le projet</button>
    <div id="create-status" class="hidden"></div>

    <div class="section-title" data-i18n="proj.data.title" style="margin-top:32px">Dossier des données</div>
    <div id="data-first" class="status warn hidden" style="margin:0 0 10px" data-i18n="proj.data.first">Premier lancement : vos projets et textures seront enregistrés dans ce dossier. Vous pouvez le changer maintenant.</div>
    <div class="data-path" id="data-path"></div>
    <div class="proj-actions" style="margin-top:0">
      <button class="btn-export" onclick="window.pywebview.api.open_data_folder()" data-i18n="proj.data.open">📂 Ouvrir le dossier</button>
      <button class="btn-export hidden" id="btn-data-change" onclick="changeDataLocation()" data-i18n="proj.data.change">📦 Changer l'emplacement…</button>
    </div>
    <div id="data-status" class="status hidden"></div>
  </div>

  <!-- Projets récents -->
  <div class="projects-list">
    <div class="section-title" data-i18n="proj.recent">Projets récents</div>
    <button class="btn-create" onclick="browseProject()" data-i18n="proj.browse" style="margin-bottom:8px;font-size:12px">📂 Parcourir un projet existant</button>
    <button class="btn-create" onclick="importProject()" data-i18n="proj.import" style="margin-bottom:10px;font-size:12px">📥 Importer une sauvegarde (.mgp.zip)</button>
    <label class="opt-line"><input type="checkbox" id="chk-outputs"><span data-i18n="proj.export.outputs">Inclure les résultats dans les sauvegardes (cache, satmaps, masques, rapports)</span></label>
    <div id="io-status" class="status hidden" style="margin:0 0 14px"></div>
    <input type="text" class="search-bar" id="search" data-i18n-ph="proj.search.ph" placeholder="Rechercher un projet..." oninput="filterProjects()">
    <div id="proj-list"><div class="no-projects"><span class="spinner"></span><span data-i18n="loading">Chargement...</span></div></div>
  </div>

</div>

<!-- Footer -->
<div class="footer">
  <div class="footer-left">MAP GENERATOR PRO · BY GIORBEV</div>
  <div class="footer-right" id="footer-count"></div>
</div>

<script>
var _projects = [];
var _confirmDel = null;

function goBack() {
  if (window.pywebview) window.pywebview.api.go_accueil();
}

// ── Charger les projets ───────────────────────────────────────────────────────
function initApp() {
  window.pywebview.api.restore_last_project().then(function(res) {
    if (res && res.ok) {
      setTimeout(function() { window.pywebview.api.go_navigation(); }, 150);
    } else {
      loadDataLocation();
      window.pywebview.api.list_projects().then(renderProjects).catch(function(err) {
        document.getElementById('proj-list').innerHTML = '<div class="no-projects">Erreur : ' + err + '</div>';
      });
    }
  }).catch(function() {
    loadDataLocation();
    window.pywebview.api.list_projects().then(renderProjects);
  });
}

// ── Dossier des données ───────────────────────────────────────────────────────
function loadDataLocation() {
  window.pywebview.api.get_data_location().then(function(res) {
    document.getElementById('data-path').textContent = res.path;
    document.getElementById('btn-data-change').classList.toggle('hidden', !res.can_change);
    document.getElementById('data-first').classList.toggle('hidden', !(res.first_launch && res.can_change));
  });
}

function dataStatus(cls, html) {
  var el = document.getElementById('data-status');
  el.className = 'status ' + cls;
  el.innerHTML = html;
}

function changeDataLocation() {
  dataStatus('ok', '<span class="spinner"></span>' + window._i18n.t('proj.data.copying'));
  window.pywebview.api.change_data_location().then(function(res) {
    if (res && res.cancelled) { dataStatus('hidden', ''); return; }
    if (!res || !res.ok) { dataStatus('err', '❌ ' + esc(res && res.error)); return; }
    dataStatus('warn',
      '✅ ' + window._i18n.t(res.copied ? 'proj.data.copied' : 'proj.data.reused') + '<div class="io-lines">' + esc(res.path) +
      (res.copied ? '<br>' + window._i18n.t('proj.data.oldkept') + ' ' + esc(res.old_path) : '') + '</div>' +
      window._i18n.t('proj.data.restart.msg') +
      '<div class="confirm-btns"><button class="btn-open" onclick="window.pywebview.api.restart_app()">' +
      window._i18n.t('proj.data.restart') + '</button></div>');
  }).catch(function(e) { dataStatus('err', '❌ ' + esc(e && e.message ? e.message : e)); });
}

window.addEventListener('pywebviewready', initApp);
// Fallback si déjà prêt
if (window.pywebview && window.pywebview.api) initApp();

function renderProjects(projects) {
  _projects = projects || [];
  document.getElementById('footer-count').textContent = _projects.length + ' ' + window._i18n.t('proj.count');
  filterProjects();
}

function filterProjects() {
  var q = document.getElementById('search').value.toLowerCase();
  var filtered = _projects.filter(function(p) {
    return p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q);
  });
  var list = document.getElementById('proj-list');
  if (!filtered.length) {
    list.innerHTML = '<div class="no-projects">' + window._i18n.t('proj.none') + '</div>';
    return;
  }
  // Stocker les paths dans un registre pour éviter les problèmes de caractères spéciaux
  window._projRegistry = {};
  filtered.forEach(function(p) { window._projRegistry[p.name] = p.path; });

  list.innerHTML = filtered.map(function(p) {
    var date = p.updated_at ? p.updated_at.substring(0,10) : '';
    var hm = p.heightmap ? '<div class="proj-hm">Heightmap : ' + p.heightmap + '</div>' : '';
    var ename = encodeURIComponent(p.name).replace(/'/g, '%27');
    return '<div class="project-card" id="card-' + ename + '">' +
      '<div class="proj-name">✅ ' + p.name + '</div>' +
      (p.description ? '<div class="proj-meta">' + p.description + '</div>' : '') +
      hm +
      '<div class="proj-date">' + window._i18n.t('proj.modified') + ' ' + date + '</div>' +
      '<div class="proj-actions">' +
        '<button class="btn-open" onclick="openProjectByName(\'' + ename + '\')">' + window._i18n.t('btn.open') + '</button>' +
        '<button class="btn-export" onclick="exportByName(\'' + ename + '\')">' + window._i18n.t('proj.export') + '</button>' +
        '<button class="btn-del" onclick="askDeleteByName(event,\'' + ename + '\')">' + window._i18n.t('btn.delete') + '</button>' +
      '</div>' +
      '<div class="confirm-del hidden" id="confirm-' + ename + '">' +
        window._i18n.t('proj.del.confirm') + ' <strong>' + p.name + '</strong> ?' +
        '<div class="confirm-btns">' +
          '<button class="btn-confirm-yes" onclick="confirmDeleteByName(\'' + ename + '\')">✅ ' + window._i18n.t('btn.confirm') + '</button>' +
          '<button class="btn-confirm-no" onclick="cancelDelete(\'' + ename + '\')">❌ ' + window._i18n.t('btn.cancel') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function openProjectByName(ename) {
  var path = window._projRegistry[decodeURIComponent(ename)];
  if (path) openProject(path);
}
function askDeleteByName(e, ename) {
  var name = decodeURIComponent(ename);
  askDelete(e, name, window._projRegistry[name]);
}
function confirmDeleteByName(ename) {
  var path = window._projRegistry[decodeURIComponent(ename)];
  if (path) confirmDelete(path);
}

// ── Créer ─────────────────────────────────────────────────────────────────────
function createProject() {
  var name = document.getElementById('inp-name').value.trim();
  var author = document.getElementById('inp-author').value.trim();
  var desc = document.getElementById('inp-desc').value.trim();
  var status = document.getElementById('create-status');
  if (!name) {
    status.className = 'status err';
    status.textContent = window._i18n.t('proj.name.required');
    status.classList.remove('hidden');
    return;
  }
  status.className = 'status ok';
  status.innerHTML = '<span class="spinner"></span>' + window._i18n.t('proj.creating');
  status.classList.remove('hidden');
  if (window.pywebview) {
    window.pywebview.api.create_project(name, author, desc).then(function(res) {
      if (res.ok) {
        status.textContent = window._i18n.t('proj.created');
        setTimeout(function() { openProject(res.path); }, 600);
      } else {
        status.className = 'status err';
        status.textContent = '❌ ' + res.error;
      }
    }).catch(function(e) {
      status.className = 'status err';
      status.textContent = '❌ Erreur : ' + (e && e.message ? e.message : String(e));
    });
  }
}

// Enter sur le champ nom
document.getElementById('inp-name').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') createProject();
});

// ── Ouvrir ────────────────────────────────────────────────────────────────────
function openProject(path) {
  if (window.pywebview) {
    window.pywebview.api.load_project(path).then(function(res) {
      if (res.ok) {
        setTimeout(function() {
          window.pywebview.api.go_navigation();
        }, 150);
      }
    }).catch(function(e) { console.error('load_project error', e); });
  }
}

// ── Supprimer ─────────────────────────────────────────────────────────────────
function askDelete(e, name, path) {
  e.stopPropagation();
  var ename = encodeURIComponent(name).replace(/'/g, '%27');
  if (_confirmDel && _confirmDel !== name) cancelDelete(encodeURIComponent(_confirmDel).replace(/'/g,'%27'));
  _confirmDel = name;
  document.getElementById('confirm-' + ename).classList.remove('hidden');
}

function cancelDelete(ename) {
  var el = document.getElementById('confirm-' + ename);
  if (el) el.classList.add('hidden');
  _confirmDel = null;
}

function confirmDelete(path) {
  if (window.pywebview) {
    window.pywebview.api.delete_project(path).then(function(res) {
      if (res.ok) {
        _confirmDel = null;
        window.pywebview.api.list_projects().then(renderProjects);
      }
    });
  }
}

// ── Sauvegarder (exporter) / importer ─────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function ioStatus(cls, html) {
  var el = document.getElementById('io-status');
  el.className = 'status ' + cls;
  el.innerHTML = html;
}

function exportByName(ename) {
  var path = window._projRegistry[decodeURIComponent(ename)];
  if (!path || !window.pywebview) return;
  var withOutputs = document.getElementById('chk-outputs').checked;
  ioStatus('ok', '<span class="spinner"></span>' + window._i18n.t('proj.export.running'));
  window.pywebview.api.export_project(path, withOutputs).then(function(res) {
    if (res && res.cancelled) { ioStatus('hidden', ''); return; }
    if (!res || !res.ok) { ioStatus('err', '❌ ' + esc(res && res.error)); return; }
    var lines = [esc(res.path), res.n_files + ' ' + window._i18n.t('proj.files') + ', ' + (res.size / 1e6).toFixed(1) + ' ' + window._i18n.t('proj.mb')];
    (res.missing || []).forEach(function(m) {
      lines.push('⚠ ' + window._i18n.t('proj.export.missing') + ' ' + esc(m.key) + ' = ' + esc(m.path));
    });
    ioStatus((res.missing || []).length ? 'warn' : 'ok',
      '✅ ' + window._i18n.t('proj.export.done') + '<div class="io-lines">' + lines.join('<br>') + '</div>');
  }).catch(function(e) { ioStatus('err', '❌ ' + esc(e && e.message ? e.message : e)); });
}

function importProject(archivePath, newName, replace) {
  if (!window.pywebview) return;
  ioStatus('ok', '<span class="spinner"></span>' + window._i18n.t('proj.import.running'));
  window.pywebview.api.import_project(archivePath || '', newName || '', !!replace).then(function(res) {
    if (res && res.cancelled) { ioStatus('hidden', ''); return; }
    if (res && res.conflict) { showConflict(res); return; }
    if (!res || !res.ok) { ioStatus('err', '❌ ' + esc(res && res.error)); return; }
    var lines = [];
    (res.missing_external || []).forEach(function(m) {
      lines.push('⚠ ' + window._i18n.t('proj.import.repoint') + ' ' + esc(m.key) + ' = ' + esc(m.path));
    });
    if (!res.has_textures) lines.push('⚠ ' + window._i18n.t('proj.import.sync'));
    if (res.old_left) lines.push('⚠ ' + window._i18n.t('proj.import.oldleft') + ' ' + esc(res.old_left));
    ioStatus(lines.length ? 'warn' : 'ok',
      '✅ ' + window._i18n.t(res.replaced ? 'proj.import.replaced' : 'proj.import.done') + ' <strong>' + esc(res.project_name) + '</strong>' +
      ' (' + res.n_files + ' ' + window._i18n.t('proj.files') + ')' +
      (lines.length ? '<div class="io-lines">' + lines.join('<br>') + '</div>' : '') +
      '<div class="confirm-btns"><button class="btn-open" onclick="window.pywebview.api.go_navigation()">' +
      window._i18n.t('btn.open') + '</button></div>');
    window.pywebview.api.list_projects().then(renderProjects);
  }).catch(function(e) { ioStatus('err', '❌ ' + esc(e && e.message ? e.message : e)); });
}

var _conflict = null;
function showConflict(res) {
  _conflict = res;
  ioStatus('warn io-conflict', window._i18n.t('proj.import.conflict') + ' <strong>' + esc(res.folder) + '</strong>.' +
    '<input type="text" id="inp-import-name" value="' + esc(res.suggested_name) + '">' +
    '<div class="confirm-btns">' +
      '<button class="btn-open" onclick="conflictRename()">' + window._i18n.t('proj.import.rename') + '</button>' +
      '<button class="btn-del" id="btn-import-replace" onclick="conflictReplace()">' + window._i18n.t('proj.import.replace') + '</button>' +
      '<button class="btn-confirm-no" onclick="ioStatus(\'hidden\', \'\')">' + window._i18n.t('btn.cancel') + '</button>' +
    '</div>');
  var inp = document.getElementById('inp-import-name');
  inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') conflictRename(); });
  inp.focus();
  inp.select();
}

function conflictRename() {
  var name = document.getElementById('inp-import-name').value.trim();
  if (name) importProject(_conflict.archive_path, name, false);
}

function conflictReplace() {
  // Deux clics : le premier demande confirmation (l'ancien projet est supprimé)
  var btn = document.getElementById('btn-import-replace');
  if (!btn.dataset.armed) {
    btn.dataset.armed = '1';
    btn.textContent = window._i18n.t('proj.import.replace.confirm');
    return;
  }
  importProject(_conflict.archive_path, '', true);
}

// ── Parcourir un projet existant ──────────────────────────────────────────────
function browseProject() {
  if (!window.pywebview) return;
  window.pywebview.api.pick_existing_project().then(function(res) {
    if (res && res.ok) {
      setTimeout(function() { window.pywebview.api.go_navigation(); }, 150);
    } else if (res && !res.cancelled) {
      alert(window._i18n.t('proj.invalid'));
    }
  }).catch(function(e) { console.error('pick_existing_project error', e); });
}
</script>
<script src="i18n.js"></script>

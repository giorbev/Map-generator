<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;align-items:stretch;justify-content:stretch;min-height:100vh;margin:0;padding:0;overflow:hidden}
.nav-screen{width:100vw;height:100vh;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:0}
.header{position:relative;z-index:11;display:flex;align-items:center;justify-content:space-between;padding:10px 24px;border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(18,26,30,0.85);min-height:60px}
.header-left{display:flex;align-items:center;gap:16px}
.header-meta{display:flex;align-items:center;gap:18px;font-family:var(--font-title);font-size:var(--fs-sm);color:var(--text-3);letter-spacing:1px;text-transform:uppercase;text-align:right}
.project-badge{font-family:var(--font-title);font-size:var(--fs-xs);color:var(--accent);letter-spacing:2px;text-transform:uppercase;font-weight:600}
.project-name{font-family:var(--font-title);font-size:var(--fs-xl);color:var(--text);letter-spacing:.5px;font-weight:700;line-height:1.15}
.grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);flex:1;gap:10px;padding:14px 24px 10px}
.card{border-radius:var(--radius);cursor:pointer;position:relative;overflow:hidden;height:100%;border:2px solid transparent;box-shadow:var(--shadow);transition:border-color .15s,transform .15s;background:var(--surface)}
.card img{transition:transform .4s ease,filter .2s}
.card:hover{border-color:var(--border-hi)}
.card:hover img{transform:scale(1.03);filter:brightness(1.08)}
.card.active{border-color:var(--accent)}
.card.disabled{cursor:not-allowed;opacity:0.6}
.card.empty{cursor:default;background:rgba(36,51,59,0.35);border:2px dashed var(--border);box-shadow:none}
.card.empty:hover{border-color:var(--border)}
.card-bg{position:absolute;inset:0;width:100%;height:100%}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,20,24,0.95) 0%,rgba(14,20,24,0.55) 38%,transparent 70%)}
.card-content{position:absolute;bottom:0;left:0;right:0;padding:16px 20px 18px}
.card-title{font-family:var(--font-title);font-size:var(--fs-2xl);color:var(--text);letter-spacing:.5px;text-transform:uppercase;font-weight:700;line-height:1.1;margin-bottom:4px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.card-desc{font-family:var(--font-body);font-size:var(--fs-md);color:var(--text-2)}
.card-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.card:hover .card-bar{transform:scaleX(.35)}
.card.active .card-bar{transform:scaleX(1)}
.wip-badge{position:absolute;top:10px;left:10px;font-family:var(--font-title);font-size:var(--fs-xs);font-weight:700;color:var(--on-accent);background:var(--accent);letter-spacing:1px;border-radius:3px;padding:2px 8px;text-transform:uppercase;z-index:2}
.back-btn{margin-right:4px}
.footer{position:relative;z-index:2;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:6px 76px 10px 24px;font-family:var(--font-title);font-size:var(--fs-xs);color:var(--text-3);letter-spacing:1.5px;text-transform:uppercase}
</style></head><body>
<div class="nav-screen mgp-backdrop">
  <div class="header">
    <div class="header-left">
      <button class="back-btn mgp-btn" onclick="goProjects()" data-i18n="nav.projects">&#9664; Projets</button>
      <div>
        <div class="project-badge" id="proj-badge" data-i18n="active.project">Projet actif</div>
        <div class="project-name" id="proj-name">---</div>
      </div>
    </div>
    <div class="header-meta"><span id="hud-tr">Tiles 32×32 · 16×16 km · Enfusion · V8.3.0</span></div>
  </div>
  <div class="grid">
    <div class="card" onclick="setActive(this)">
      <div class="card-bg"><img src="img/terrain.jpg" style="width:100%;height:100%;object-fit:cover"></div>
      <div class="card-overlay"></div>
      
      <div class="card-bar"></div>
      <div class="card-content">
        <div class="card-title">TERRAIN</div>
        <div class="card-desc" data-i18n="nav.terrain.desc">Heightmap - Atlas</div>
      </div>
    </div>
    <div class="card" onclick="setActive(this)">
      <div class="card-bg"><img src="img/inspections.jpg" style="width:100%;height:100%;object-fit:cover"></div>
      <div class="card-overlay"></div>

      <div class="card-bar"></div>
      <div class="card-content">
        <div class="card-title">TILE DIAGNOSTIC</div>
        <div class="card-desc" data-i18n="nav.diag.desc">Carte - Tuiles - Fichiers</div>
      </div>
    </div>
    <div class="card active" onclick="setActive(this)">
      <div class="card-bg"><img src="img/generation.jpg" style="width:100%;height:100%;object-fit:cover"></div>
      <div class="card-overlay"></div>

      <div class="card-bar"></div>
      <div class="card-content">
        <div class="card-title">GENERATION</div>
        <div class="card-desc" data-i18n="nav.gen.desc">Masques - Baking</div>
      </div>
    </div>
    <div class="card" onclick="setActive(this)">
      <div class="card-bg"><img src="img/satmap.jpg" style="width:100%;height:100%;object-fit:cover"></div>
      <div class="card-overlay"></div>

      <div class="card-bar"></div>
      <div class="card-content">
        <div class="card-title">SATMAP</div>
        <div class="card-desc" data-i18n="nav.satmap.desc">Texture - Couleurs</div>
      </div>
    </div>
    <!-- Emplacement libre (ancienne carte Corrections, fusionnée dans Tile Diagnostic à l'étape 11d) -->
    <div class="card empty"></div>
    <div class="card" onclick="setActive(this)">
      <div class="card-bg"><img src="img/Aides.jpg" style="width:100%;height:100%;object-fit:cover"></div>
      <div class="card-overlay"></div>
      <div class="wip-badge" data-i18n="nav.coming">A VENIR</div>
      <div class="card-bar"></div>
      <div class="card-content">
        <div class="card-title" data-i18n="nav.help.title">HELP</div>
        <div class="card-desc" data-i18n="nav.help.desc">Documentation</div>
      </div>
    </div>
  </div>
  <div class="footer"><span>Map Generator Pro · by Giorbev</span><span data-i18n="session.active">SESSION ACTIVE</span></div>
</div>
<script>
var _tabMap = {
  'TERRAIN': 'heightmap',
  'TILE DIAGNOSTIC': 'diagnostic',
  'GENERATION': 'pipeline_v5',
  'SATMAP': 'satmap',
  'AIDE': 'help',
  'HELP': 'help',
};

function setActive(el) {
  document.querySelectorAll('.card').forEach(function(c) { c.classList.remove('active'); });
  el.classList.add('active');
  var title = el.querySelector('.card-title');
  if (title && window.pywebview) {
    var tab = _tabMap[title.textContent.trim()] || title.textContent.trim().toLowerCase();
    window.pywebview.api.navigate(tab);
  }
}

function initApp() {
  window.pywebview.api.get_current_project().then(function(proj) {
    if (proj) {
      document.getElementById('proj-badge').textContent = window._i18n.t('active.project');
      document.getElementById('proj-name').textContent = proj.name;
    }
  });
}
window.addEventListener('pywebviewready', initApp);
if (window.pywebview && window.pywebview.api) initApp();

function goProjects() {
  if (window.pywebview && window.pywebview.api) {
    window.pywebview.api.go_projects();
  } else {
    window.addEventListener('pywebviewready', function() {
      window.pywebview.api.go_projects();
    }, { once: true });
  }
}
</script>
<script src="i18n.js"></script>
<script src="log_panel.js"></script>
</body></html>

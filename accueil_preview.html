<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const photo = document.getElementById('photo');
photo.style.opacity = '0.82';
photo.style.clipPath = 'inset(0 100% 0 0)';
const sweep = document.getElementById('sweep');
const content = document.getElementById('content');
const srcImg = document.getElementById('src_img');

const W = window.innerWidth, H = window.innerHeight;
cv.width = W; cv.height = H;

const cols = 24, rows = 15;
let pts = [];

function buildFromImage() {
  // Canvas offscreen pour lire les pixels de l'image
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const octx = off.getContext('2d');
  octx.drawImage(srcImg, 0, 0, W, H);
  const px = octx.getImageData(0, 0, W, H).data;

  pts = [];
  for (let r = 0; r <= rows; r++) {
    for (let c = 0; c <= cols; c++) {
      const x = Math.round((c / cols) * W);
      const y = Math.round((r / rows) * H);
      const i = (Math.min(y, H-1) * W + Math.min(x, W-1)) * 4;
      // Luminosité = moyenne RGB
      const lum = (px[i] * 0.299 + px[i+1] * 0.587 + px[i+2] * 0.114) / 255;
      // Z : zones claires (ciel, roches) = hautes, zones sombres (forêts) = basses
      const z = (lum - 0.45) * 140;
      pts.push({ x, y: y - z * 0.55, z, lum });
    }
  }
}

function drawWire(alpha) {
  ctx.clearRect(0, 0, W, H);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const p  = pts[r * (cols+1) + c];
      const pr = pts[r * (cols+1) + c + 1];
      const pb = pts[(r+1) * (cols+1) + c];
      // Couleur basée sur la luminosité du pixel source
      const g = Math.round(60 + p.lum * 120);
      ctx.strokeStyle = `rgba(30,${g},50,${alpha})`;
      ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(pr.x, pr.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    }
  }
  // Points sommets
  pts.forEach(p => {
    const g = Math.round(80 + p.lum * 140);
    ctx.fillStyle = `rgba(40,${g},60,${alpha * 0.6})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 1.1, 0, Math.PI*2); ctx.fill();
  });
}

let frame = 0, wipeX = -1, wipeDone = false;

function animate() {
  frame++;
  if (frame < 150) {
    drawWire(Math.min(frame / 120, 1));
  } else if (frame < 180) {
    drawWire(1);
  } else if (frame === 180) {
    wipeX = 0; sweep.style.opacity = '1';
    drawWire(1);
  } else if (!wipeDone) {
    wipeX += W / 180;
    sweep.style.left = wipeX + 'px';
    const pct = Math.min(wipeX / W, 1);
    // La photo suit le trait : clipPath revele progressivement de gauche a droite
    photo.style.clipPath = 'inset(0 ' + Math.round((1 - pct) * 100) + '% 0 0)';
    photo.style.opacity = '0.82';
    // Fil de fer s efface progressivement
    drawWire(Math.max(0, 1 - pct * 1.2));
    if (wipeX >= W + 10) {
      wipeDone = true;
      sweep.style.opacity = '0';
      content.classList.add('show');
      return;
    }
  }
  requestAnimationFrame(animate);
}

// Attendre que l'image soit chargée
if (srcImg.complete) {
  buildFromImage();
  requestAnimationFrame(animate);
} else {
  srcImg.onload = () => { buildFromImage(); requestAnimationFrame(animate); };
}
</script></body></html>

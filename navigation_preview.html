<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050e09;display:flex;align-items:stretch;justify-content:stretch;min-height:100vh;margin:0;padding:0;overflow:hidden;font-family:'Courier New',monospace}
.nav-screen{width:100vw;min-height:100vh;background:#0b1a14;border-radius:0;border:none;padding:28px 32px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.topo-bg{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 28px,#1a3326 29px),repeating-linear-gradient(90deg,transparent,transparent 28px,#1a3326 29px);opacity:0.1}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,#050e09 100%)}
.corner{position:absolute;width:16px;height:16px;border-color:#2e6647;border-style:solid}
.tl{top:10px;left:10px;border-width:2px 0 0 2px}.tr{top:10px;right:10px;border-width:2px 2px 0 0}
.bl{bottom:10px;left:10px;border-width:0 0 2px 2px}.br{bottom:10px;right:10px;border-width:0 2px 2px 0}
.header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid #1e3d2a}
.header-left{display:flex;align-items:center;gap:12px}
.project-badge{font-size:10px;color:#2e8b57;letter-spacing:3px;text-transform:uppercase}
.project-name{font-size:15px;color:#c8e8d4;letter-spacing:1px;font-weight:700}
.header-meta{font-size:9px;color:#2e5c3e;letter-spacing:2px;text-align:right;line-height:1.8}
.grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{border-radius:12px;cursor:pointer;position:relative;overflow:hidden;height:160px;border:1px solid #1e3d2a;transition:all .2s}
.card:hover{border-color:#2e6647;transform:translateY(-2px)}
.card.active{border-color:#5dba7d;border-width:2px}
.card.disabled{cursor:not-allowed;opacity:0.6}
.card.disabled:hover{transform:none;border-color:#1e3d2a}
.card-bg{position:absolute;inset:0;width:100%;height:100%}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(5,14,9,0.92) 0%,rgba(5,14,9,0.55) 45%,transparent 100%)}
.card.active .card-overlay{background:linear-gradient(to top,rgba(5,14,9,0.88) 0%,rgba(15,35,24,0.5) 45%,transparent 100%)}
.card-content{position:absolute;bottom:0;left:0;right:0;padding:10px 12px 12px}
.card-title{font-size:14px;color:#c8e8d4;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.card.active .card-title{color:#a0e0ba}
.card-desc{font-size:11px;color:#7ab890;letter-spacing:1px}
.card-dot{position:absolute;top:10px;right:10px;width:6px;height:6px;border-radius:50%;background:#1e4d2e;transition:all .2s}
.card:hover .card-dot{background:#2e6647}
.card.active .card-dot{background:#5dba7d;box-shadow:0 0 6px #5dba7d}
.wip-badge{position:absolute;top:8px;left:8px;font-size:7px;color:#4a6e50;letter-spacing:1px;border:1px solid #1e4d2e;border-radius:3px;padding:1px 5px;text-transform:uppercase;z-index:2}
.scan-line{position:absolute;left:0;right:0;height:1px;background:#2e6647;opacity:0.2;animation:scan 5s linear infinite;z-index:0}
.back-btn{background:transparent;border:1px solid #2e6647;border-radius:6px;color:#5dba7d;font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;padding:5px 12px;cursor:pointer;transition:all .2s;text-transform:uppercase;margin-right:12px}
.back-btn:hover{background:#1a3d2a;color:#a0e0ba}
@keyframes scan{0%{top:0}100%{top:100%}}
.footer{position:relative;z-index:2;margin-top:18px;padding-top:12px;border-top:1px solid #1a3326;display:flex;justify-content:space-between;align-items:center}
.footer-left,.footer-right{font-size:9px;color:#2e5c3e;letter-spacing:2px}
</style></head><body>

<script>
var _tabMap = {
  'TERRAIN': 'heightmap',
  'INSPECTION': 'terrain',
  'GENERATION': 'pipeline_v5',
  'SATMAP': 'satmap',
  'CORRECTIONS': 'corrections',
  'AIDE': 'help',
  'HELP': 'help',
};

function setActive(el) {
  document.querySelectorAll('.card').forEach(function(c) { c.classList.remove('active'); });
  el.classList.add('active');
  var title = el.querySelector('.card-title');
  if (title && window.pywebview) {
    var tab = _tabMap[title.textContent.trim()] || title.textContent.trim().toLowerCase();
    window.pywebview.api.navigate(tab);
  }
}

function initApp() {
  window.pywebview.api.get_current_project().then(function(proj) {
    if (proj) {
      document.getElementById('proj-badge').textContent = 'Projet actif';
      document.getElementById('proj-name').textContent = proj.name;
    }
  });
}
window.addEventListener('pywebviewready', initApp);
if (window.pywebview && window.pywebview.api) initApp();
</script>
